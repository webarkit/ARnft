name: CI
on:
    - push
    - pull_request

jobs:
    tests:
        strategy:
            matrix:
                node:
                    - 22.13.0

        runs-on: ubuntu-24.04
        name: Node.js ${{ matrix.node }}
        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: yarn

            - name: Install
              run: |
                  yarn

            - name: Tests
              run: |
                  yarn format-check

            - name: Test Build docs
              run: |
                  yarn docs
